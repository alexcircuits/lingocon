# LingoCon Rust workspace.
#
# - `lingocon-core`: pure, deterministic language logic (no I/O). Every module that
#   mirrors TypeScript behaviour carries parity tests against the TS implementation.
# - `lingocon-api`: the Axum platform service. Next.js calls it over loopback for
#   page data today; it can also verify Auth.js sessions itself so whole pages can
#   move to Rust later without a big-bang rewrite.
[workspace]
members = ["crates/core", "crates/api"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (the default) on purpose: the API turns a panicking request into a 500
# instead of taking the whole service down.

# Shared dependency versions (used by lingocon-api via `name.workspace = true`).
[workspace.dependencies]
aes = "0.9.2"
anyhow = "1.0.100"
axum = "0.8.9"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
deadpool-postgres = "0.14.2"
dotenvy = "0.15.7"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.3"
percent-encoding = "2.3.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.15"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "request-id", "timeout", "trace", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
webpki-roots = "1.0.4"
