services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langua
      POSTGRES_PASSWORD: langua
      POSTGRES_DB: langua
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langua -d langua"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langua:langua@db:5432/langua
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # No default: a well-known secret lets anyone forge session JWTs (including admin ones).
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (openssl rand -base64 32)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Optional — only needed for OAuth / email features
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Optional Rust platform service (see the `api` service below). Unset = the
      # TypeScript implementations are used.
      LINGOCON_API_URL: ${LINGOCON_API_URL:-}
      LINGOCON_API_TOKEN: ${LINGOCON_API_TOKEN:-}
    ports:
      - "3000:3000"

  # Optional Rust platform service (rust/crates/api), started only with
  #   LINGOCON_API_TOKEN=$(openssl rand -hex 32) LINGOCON_API_URL=http://api:3040 \
  #     docker compose --profile rust-api up
  # No published ports: only the app container talks to it.
  api:
    profiles: ["rust-api"]
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # The service drains in-flight requests for up to 20 s after SIGTERM.
    stop_grace_period: 25s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langua:langua@db:5432/langua
      LINGOCON_API_TOKEN: ${LINGOCON_API_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}

  # One-shot migration runner — runs on every `docker compose up`
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langua:langua@db:5432/langua
    restart: "no"

volumes:
  postgres_data:
