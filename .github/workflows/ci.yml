name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma client must be generated before tsc — types are imported widely.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Non-blocking for now: the outstanding advisories are in Next.js and
      # require the deliberate framework upgrade. Surfaces new high/critical CVEs
      # without failing the build. Tighten to a blocking gate once Next is bumped.
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # `next build` catches what tsc/lint can't (server/client boundary errors, missing Suspense
  # around useSearchParams, prerender failures). Pages prerender against an empty migrated DB.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingocon
          POSTGRES_PASSWORD: lingocon
          POSTGRES_DB: lingocon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingocon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingocon:lingocon@localhost:5432/lingocon?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Build-only placeholder (never deployed); real deployments set their own secret.
      AUTH_SECRET: ci-build-only-secret-not-used-at-runtime-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Build
        run: npm run build

  # Critical journeys in a real browser against `next dev` with DEV_MODE (auth bypass) and the
  # default seed — see e2e/README.md.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingocon
          POSTGRES_PASSWORD: lingocon
          POSTGRES_DB: lingocon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingocon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingocon:lingocon@localhost:5432/lingocon?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DEV_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
