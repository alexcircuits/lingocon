name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma client must be generated before tsc — types are imported widely.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # What runs in production must have no high/critical advisories.
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      # Build/dev tooling, informational: Tailwind 3, eslint-config-next and patch-package
      # reach `braces` (no patched release; they only expand our own glob patterns).
      - name: Dependency audit (all, informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  # `next build` catches what tsc/lint can't (server/client boundary errors, missing Suspense
  # around useSearchParams, prerender failures). Pages prerender against an empty migrated DB.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingocon
          POSTGRES_PASSWORD: lingocon
          POSTGRES_DB: lingocon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingocon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingocon:lingocon@localhost:5432/lingocon?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Build-only placeholder (never deployed); real deployments set their own secret.
      AUTH_SECRET: ci-build-only-secret-not-used-at-runtime-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Build
        run: npm run build

  # Real-browser suite against a production build (`next start`) with real sign-in: e2e/seed.ts
  # creates role accounts, e2e/auth.setup.ts signs them in through /login. See e2e/README.md.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingocon
          POSTGRES_PASSWORD: lingocon
          POSTGRES_DB: lingocon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingocon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingocon:lingocon@localhost:5432/lingocon?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      # Throwaway CI server only; real deployments set their own secret.
      AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0000
      DEV_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx tsx e2e/seed.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The studio overview again with the Rust service (rust/crates/api) serving its analysis:
  # the same @overview specs must pass with and without it.
  e2e-rust:
    name: E2E with the Rust service
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingocon
          POSTGRES_PASSWORD: lingocon
          POSTGRES_DB: lingocon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingocon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lingocon:lingocon@localhost:5432/lingocon?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else-0000
      DEV_MODE: "false"
      E2E_RUST: "1"
      LINGOCON_API_TOKEN: ci-e2e-service-token-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release --locked --manifest-path rust/Cargo.toml -p lingocon-api
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx tsx e2e/seed.ts
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run overview E2E against the Rust service
        run: npx playwright test --grep @overview
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-rust
          path: |
            playwright-report/
            test-results/
          retention-days: 7
